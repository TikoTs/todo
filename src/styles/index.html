<body>
    <header>TODO LIST</header>
    <div class="search-container">
      <input type="text" placeholder="Search note..." />
      <button>🔍</button>
    </div>
    <div class="filter-buttons">
      <button class="active">ALL</button>
      <button>ACTIVE</button>
      <button>COMPLETED</button>
    </div>
    <ul class="todo-list">
      <li class="todo-item">
        <input type="checkbox" />
        <span>NOTE #1</span>
        <button>✏️</button>
        <button>🗑️</button>
      </li>
      <li class="todo-item">
        <input type="checkbox" checked />
        <span class="completed">NOTE #2</span>
        <button>✏️</button>
        <button>🗑️</button>
      </li>
      <li class="todo-item">
        <input type="checkbox" />
        <span>NOTE #3</span>
        <button>✏️</button>
        <button>🗑️</button>
      </li>
    </ul>
    <button class="add-button">+</button>
  </body>
